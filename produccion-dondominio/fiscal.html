  <script>
    // Convert Quill Delta to HTML usando Quill para renderizado exacto
    function convertQuillDeltaToHTML(delta) {
      if (!delta || !delta.ops) return '';
      
      // Crear un editor temporal de Quill para renderizar el contenido exactamente
      if (typeof Quill !== 'undefined') {
        try {
          const tempContainer = document.createElement('div');
          tempContainer.style.position = 'absolute';
          tempContainer.style.left = '-9999px';
          document.body.appendChild(tempContainer);
          
          const tempQuill = new Quill(tempContainer, {
            theme: 'snow',
            readOnly: true
          });
          
          tempQuill.setContents(delta);
          let html = tempQuill.root.innerHTML;
          
          // Aplicar estilos de imágenes desde los atributos guardados en el Delta
          if (delta.ops) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            const images = tempDiv.querySelectorAll('img');
            
            images.forEach(img => {
              // Buscar el op correspondiente en el Delta
              const imgSrc = img.src || img.getAttribute('src');
              const matchingOp = delta.ops.find(op => {
                if (op.insert) {
                  // Manejar tanto string como objeto
                  if (typeof op.insert === 'object' && op.insert.image) {
                    const opImgSrc = typeof op.insert.image === 'string' 
                      ? op.insert.image 
                      : (op.insert.image.src || op.insert.image);
                    // Comparar URLs normalizadas (sin parámetros de query)
                    const normalizeUrl = (url) => url ? url.split('?')[0].split('#')[0] : '';
                    return normalizeUrl(opImgSrc) === normalizeUrl(imgSrc);
                  }
                }
                return false;
              });
              
              // Aplicar estilos desde los atributos guardados o desde el objeto de imagen
              if (matchingOp) {
                // Si el insert.image es un objeto con width/height
                if (typeof matchingOp.insert.image === 'object' && matchingOp.insert.image !== null) {
                  if (matchingOp.insert.image.width) {
                    img.style.setProperty('width', matchingOp.insert.image.width, 'important');
                    img.style.setProperty('max-width', matchingOp.insert.image.width, 'important');
                  }
                  if (matchingOp.insert.image.height) {
                    img.style.setProperty('height', matchingOp.insert.image.height, 'important');
                    img.style.setProperty('max-height', matchingOp.insert.image.height, 'important');
                  }
                }
                // También verificar atributos (formato estándar donde se guardan los estilos)
                if (matchingOp.attributes) {
                  if (matchingOp.attributes['data-width']) {
                    img.style.setProperty('width', matchingOp.attributes['data-width'], 'important');
                    img.style.setProperty('max-width', matchingOp.attributes['data-width'], 'important');
                  }
                  if (matchingOp.attributes['data-height']) {
                    img.style.setProperty('height', matchingOp.attributes['data-height'], 'important');
                    img.style.setProperty('max-height', matchingOp.attributes['data-height'], 'important');
                  }
                }
                // Remover img-fluid si hay estilos personalizados para evitar conflictos
                if (matchingOp.attributes && (matchingOp.attributes['data-width'] || matchingOp.attributes['data-height'])) {
                  img.classList.remove('img-fluid');
                }
              }
            });
            
            html = tempDiv.innerHTML;
          }
          
          // Si no hay imágenes en el HTML renderizado, usar el método manual
          if (!html.includes('<img') && delta.ops && delta.ops.some(op => op.insert && typeof op.insert === 'object' && op.insert.image)) {
            console.warn('Quill no renderizó imágenes, usando método manual');
            document.body.removeChild(tempContainer);
            return convertQuillDeltaToHTMLManual(delta);
          }
          
          document.body.removeChild(tempContainer);
          return html;
        } catch (error) {
          console.warn('Error usando Quill para renderizar, usando método manual:', error);
          return convertQuillDeltaToHTMLManual(delta);
        }
      }
      
      // Si Quill no está disponible, usar método manual directamente
      return convertQuillDeltaToHTMLManual(delta);
    }
    
    // Método manual como fallback
    function convertQuillDeltaToHTMLManual(delta) {
        let html = '';
        let currentParagraph = '';
        let currentList = null;
        let currentListItems = [];
        let currentListItemText = '';
        
        delta.ops.forEach((op, index) => {
          if (op.insert) {
            if (typeof op.insert === 'string') {
              let text = op.insert;
              const isNewline = text === '\n';
              
              // Manejar formato de texto (sin incluir el salto de línea en el formato)
              // Preservar emojis y caracteres especiales
              let formattedText = isNewline ? '' : text;
              if (!isNewline && op.attributes) {
                // Aplicar formatos en el orden correcto (de dentro hacia fuera)
                let innerText = formattedText;
                
                // Color de texto
                if (op.attributes.color) {
                  innerText = `<span style="color: ${op.attributes.color};">${innerText}</span>`;
                }
                
                // Color de fondo (resaltado de importancia)
                if (op.attributes.background) {
                  innerText = `<span style="background-color: ${op.attributes.background};">${innerText}</span>`;
                }
                
                // Enlaces
                if (op.attributes.link) {
                  innerText = `<a href="${op.attributes.link}" target="_blank">${innerText}</a>`;
                }
                
                // Formato de texto
                if (op.attributes.bold) innerText = `<strong>${innerText}</strong>`;
                if (op.attributes.italic) innerText = `<em>${innerText}</em>`;
                if (op.attributes.underline) innerText = `<u>${innerText}</u>`;
                if (op.attributes.strike) innerText = `<s>${innerText}</s>`;
                
                formattedText = innerText;
              }
              
              // Manejar headers
              if (op.attributes && op.attributes.header) {
                // Cerrar lista si existe
                if (currentList) {
                  if (currentListItemText) {
                    currentListItems.push(`<li>${currentListItemText}</li>`);
                    currentListItemText = '';
                  }
                  if (currentListItems.length > 0) {
                    html += `<${currentList}>${currentListItems.join('')}</${currentList}>`;
                  }
                  currentList = null;
                  currentListItems = [];
                }
                // Cerrar párrafo si existe
                if (currentParagraph) {
                  html += `<p>${currentParagraph}</p>`;
                  currentParagraph = '';
                }
                const level = op.attributes.header;
                const headerText = formattedText.replace(/\n/g, '');
                html += `<h${level}>${headerText}</h${level}>`;
                return;
              }
              
              // Manejar listas
              if (op.attributes && op.attributes.list) {
                const listType = op.attributes.list === 'ordered' ? 'ol' : 'ul';
                
                // Si cambia el tipo de lista, cerrar la anterior
                if (currentList && currentList !== listType) {
                  if (currentListItemText.trim()) {
                    currentListItems.push(`<li>${currentListItemText}</li>`);
                    currentListItemText = '';
                  }
                  if (currentListItems.length > 0) {
                    html += `<${currentList}>${currentListItems.join('')}</${currentList}>`;
                  }
                  currentListItems = [];
                }
                
                // Cerrar párrafo si existe
                if (currentParagraph.trim()) {
                  html += `<p>${currentParagraph}</p>`;
                  currentParagraph = '';
                }
                
                // Iniciar o continuar lista
                if (!currentList) {
                  currentList = listType;
                }
                
                // Agregar texto al elemento de lista actual
                if (!isNewline) {
                  // Acumular texto formateado en el elemento de lista actual
                  currentListItemText += formattedText;
                } else {
                  // Salto de línea en lista = finalizar elemento actual
                  if (currentListItemText.trim()) {
                    currentListItems.push(`<li>${currentListItemText}</li>`);
                    currentListItemText = '';
                  }
                  
                  // Verificar si la lista termina (siguiente op no tiene list)
                  const nextOp = delta.ops[index + 1];
                  if (!nextOp || !nextOp.attributes || !nextOp.attributes.list) {
                    // Cerrar la lista
                    if (currentListItems.length > 0) {
                      html += `<${currentList}>${currentListItems.join('')}</${currentList}>`;
                      currentList = null;
                      currentListItems = [];
                    }
                  }
                }
                return;
              }
              
              // Si hay una lista abierta y no es un elemento de lista, cerrarla
              if (currentList) {
                if (currentListItemText.trim()) {
                  currentListItems.push(`<li>${currentListItemText}</li>`);
                  currentListItemText = '';
                }
                if (currentListItems.length > 0) {
                  html += `<${currentList}>${currentListItems.join('')}</${currentList}>`;
                }
                currentList = null;
                currentListItems = [];
              }
              
              // Manejar párrafos normales
              if (isNewline) {
                if (currentParagraph.trim()) {
                  html += `<p>${currentParagraph}</p>`;
                  currentParagraph = '';
                }
              } else {
                currentParagraph += formattedText;
              }
            } else if (op.insert.image) {
              // Cerrar lista si existe
              if (currentList) {
                if (currentListItemText.trim()) {
                  currentListItems.push(`<li>${currentListItemText}</li>`);
                  currentListItemText = '';
                }
                if (currentListItems.length > 0) {
                  html += `<${currentList}>${currentListItems.join('')}</${currentList}>`;
                }
                currentList = null;
                currentListItems = [];
              }
              // Cerrar párrafo si existe
              if (currentParagraph.trim()) {
                html += `<p>${currentParagraph}</p>`;
                currentParagraph = '';
              }
              
              // Manejar tanto string como objeto para insert.image
              let imgSrc = '';
              let imgStyle = '';
              
              // Obtener el src de la imagen
              if (typeof op.insert.image === 'string') {
                // Formato estándar: string (URL)
                imgSrc = op.insert.image;
              } else if (typeof op.insert.image === 'object' && op.insert.image !== null) {
                // Formato nuevo: objeto con src, width, height
                imgSrc = op.insert.image.src || op.insert.image || '';
                if (op.insert.image.width) {
                  imgStyle += `width: ${op.insert.image.width}; `;
                }
                if (op.insert.image.height) {
                  imgStyle += `height: ${op.insert.image.height}; `;
                }
              } else {
                // Fallback: intentar obtener el src de cualquier manera
                imgSrc = op.insert.image || '';
              }
              
              // También verificar atributos (formato estándar donde se guardan los estilos)
              if (op.attributes) {
                if (op.attributes['data-width']) {
                  imgStyle += `width: ${op.attributes['data-width']}; `;
                }
                if (op.attributes['data-height']) {
                  imgStyle += `height: ${op.attributes['data-height']}; `;
                }
              }
              
              // Solo agregar la imagen si tiene un src válido
              if (imgSrc) {
                // Si hay estilos personalizados, usar !important y no usar img-fluid
                if (imgStyle) {
                  // Agregar !important a cada propiedad y también agregar object-fit: contain para mantener proporción
                  const importantStyle = imgStyle
                    .split(';')
                    .filter(s => s.trim())
                    .map(s => s.trim() + ' !important')
                    .join('; ') + '; object-fit: contain !important;';
                  html += `<img src="${imgSrc}" alt="" class="mb-3" style="${importantStyle}">`;
                } else {
                  html += `<img src="${imgSrc}" alt="" class="img-fluid mb-3">`;
                }
              }
            }
          }
        });
        
        // Cerrar lista si queda abierta
        if (currentList) {
          if (currentListItemText.trim()) {
            currentListItems.push(`<li>${currentListItemText}</li>`);
          }
          if (currentListItems.length > 0) {
            html += `<${currentList}>${currentListItems.join('')}</${currentList}>`;
          }
        }
        
        // Cerrar párrafo si queda abierto
        if (currentParagraph.trim()) {
          html += `<p>${currentParagraph}</p>`;
        }
        
        return html || '<p>Sin contenido</p>';
      }
    
    // Render blogs as accordion
    async function renderBlogsAccordion() {
      const container = document.getElementById('blogAccordion');
      if (!container) {
        console.error('Container blogAccordion no encontrado');
        return;
      }
      
      try {
        if (!window.firebaseServices || !window.firebaseServices.db) {
          console.warn('Firebase no está inicializado');
          container.innerHTML = '<div class="col-12 text-center py-5"><div class="empty-blogs-state"><div class="empty-icon mb-4"><i class="fas fa-newspaper fa-4x text-muted" style="opacity: 0.3;"></i></div><h3 class="text-muted mb-3">Próximamente</h3><p class="lead text-muted mb-4" style="max-width: 600px; margin: 0 auto;">Estamos preparando nuevos artículos y noticias interesantes para ti.<br>Vuelve pronto para leer nuestros últimos artículos sobre novedades fiscales y contables.</p></div></div>';
          return;
        }
        
        const db = window.firebaseServices.db;
        console.log('Buscando blogs publicados de categoría fiscal...');
        
        // Consulta simplificada - obtener todos los blogs y filtrar en el cliente
        // Esto evita problemas con índices compuestos de Firestore
        let snapshot;
        try {
          snapshot = await db.collection('blogs')
            .where('status', '==', 'published')
            .where('category', '==', 'fiscal')
            .get();
          console.log('Consulta exitosa, encontrados:', snapshot.size);
        } catch (error) {
          console.error('Error al cargar blogs:', error);
          throw error;
        }
        
        if (snapshot.empty) {
          console.log('No se encontraron blogs publicados de categoría fiscal');
          container.innerHTML = '<div class="col-12 text-center py-5"><div class="empty-blogs-state"><div class="empty-icon mb-4"><i class="fas fa-newspaper fa-4x text-muted" style="opacity: 0.3;"></i></div><h3 class="text-muted mb-3">Próximamente</h3><p class="lead text-muted mb-4" style="max-width: 600px; margin: 0 auto;">Estamos preparando nuevos artículos y noticias interesantes para ti.<br>Vuelve pronto para leer nuestros últimos artículos sobre novedades fiscales y contables.</p></div></div>';
          return;
        }
        
        // Filtrar blogs ocultos y archivados, y ordenar manualmente
        const blogs = [];
        snapshot.forEach((doc) => {
          const blogData = doc.data();
          // Filtrar blogs ocultos y archivados (por flag o por estado)
          if (blogData.hidden === true || blogData.archived === true || blogData.status === 'archived') {
            return;
          }
          console.log('Blog encontrado:', blogData.titleEs, 'Categoría:', blogData.category, 'Estado:', blogData.status, 'Oculto:', blogData.hidden, 'Archivado:', blogData.archived);
          blogs.push({
            id: doc.id,
            ...blogData
          });
        });
        
        console.log('Total de blogs procesados:', blogs.length);
        
        // Ordenar por order si existe, sino por fecha
        if (blogs.length > 0) {
          blogs.sort((a, b) => {
            if (a.order !== undefined && b.order !== undefined) {
              return a.order - b.order;
            }
            if (a.order !== undefined) return -1;
            if (b.order !== undefined) return 1;
            // Si no hay order, ordenar por fecha
            const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
            const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
            return dateB - dateA; // Más reciente primero
          });
        }
        
        let html = '';
        let index = 0;
        
        blogs.forEach((blog) => {
          const date = blog.createdAt ? blog.createdAt.toDate().toLocaleDateString('es-ES', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          }) : 'Fecha no disponible';
          
          const contentHtml = convertQuillDeltaToHTML(blog.contentEs);
          const collapseId = 'collapse' + index;
          const headingId = 'heading' + index;
          
          const subtitleHtml = blog.subtitleEs ? '<p class="accordion-subtitle text-muted mb-2">' + blog.subtitleEs + '</p>' : '';
          html += '<div class="card elegant-card">' +
            '<div class="card-header elegant-card-header" id="' + headingId + '">' +
            '<button class="btn btn-link elegant-accordion-button collapsed w-100 text-left" type="button" data-toggle="collapse" data-target="#' + collapseId + '" aria-expanded="false" aria-controls="' + collapseId + '" data-parent="#blogAccordion">' +
            '<div class="accordion-header-content">' +
            '<div class="accordion-title-wrapper">' +
            '<h3 class="accordion-title">' + (blog.titleEs || 'Sin título') + '</h3>' +
            subtitleHtml +
            '<small class="accordion-meta"><i class="far fa-calendar-alt"></i> Posteado por Sercon Gestoría el ' + date + '</small>' +
            '</div>' +
            '<i class="fas fa-chevron-down accordion-icon"></i>' +
            '</div>' +
            '</button>' +
            '</div>' +
            '<div id="' + collapseId + '" class="collapse" aria-labelledby="' + headingId + '">' +
            '<div class="card-body elegant-card-body">' +
            contentHtml +
            '</div>' +
            '</div>' +
            '</div>';
          
          index++;
        });
        
        container.innerHTML = html;
        
        // Initialize accordion behavior
        $('.collapse').removeClass('show');
        $('.elegant-accordion-button').addClass('collapsed');
        $('.accordion-icon').css('transform', 'rotate(0deg)');
        
        $('[data-toggle="collapse"]').on('click', function(e) {
          var target = $(this).data('target');
          var $target = $(target);
          var $parent = $(this).closest('.accordion');
          var $accordionCard = $(this).closest('.card');
          
          if ($target.hasClass('show')) {
            $target.collapse('hide');
          } else {
            $parent.find('.collapse.show').not(target).collapse('hide');
            $target.collapse('show');
            
            $target.on('shown.bs.collapse', function scrollToAccordion() {
              if ($accordionCard.length) {
                var cardTop = $accordionCard.offset().top;
                var scrollOffset = cardTop - 100;
                $('html, body').stop().animate({
                  scrollTop: scrollOffset
                }, 400);
              }
              $target.off('shown.bs.collapse', scrollToAccordion);
            });
          }
        });
        
        $('.collapse').on('show.bs.collapse', function() {
          $(this).prev().find('.accordion-icon').css('transform', 'rotate(180deg)');
          $(this).prev().find('.elegant-accordion-button').removeClass('collapsed').attr('aria-expanded', 'true');
        });
        
        $('.collapse').on('hide.bs.collapse', function() {
          $(this).prev().find('.accordion-icon').css('transform', 'rotate(0deg)');
          $(this).prev().find('.elegant-accordion-button').addClass('collapsed').attr('aria-expanded', 'false');
        });
        
      } catch (error) {
        console.error('Error loading blogs:', error);
        container.innerHTML = '<div class="col-12 text-center py-5"><div class="empty-blogs-state"><div class="empty-icon mb-4"><i class="fas fa-newspaper fa-4x text-muted" style="opacity: 0.3;"></i></div><h3 class="text-muted mb-3">Próximamente</h3><p class="lead text-muted mb-4" style="max-width: 600px; margin: 0 auto;">Estamos preparando nuevos artículos y noticias interesantes para ti.<br>Vuelve pronto para leer nuestros últimos artículos sobre novedades fiscales y contables.</p></div></div>';
      }
    }
    
    // Wait for Firebase to initialize
    $(document).ready(function() {
      setTimeout(function() {
        if (window.firebaseServices && window.firebaseServices.db) {
          renderBlogsAccordion();
        } else {
          // Retry after a bit more
          setTimeout(renderBlogsAccordion, 1000);
        }
      }, 1000);
    });
  </script>
