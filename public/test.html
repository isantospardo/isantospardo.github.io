<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Selector Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            background: #f0f0f0;
        }
        
        .language-selector {
            position: relative;
            display: inline-block;
            margin: 20px;
            z-index: 1000;
        }

        .language-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 10px 18px;
            color: #333;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(15px);
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            min-width: 80px;
            justify-content: center;
        }

        .language-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1));
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .language-btn.active {
            background: linear-gradient(135deg, rgba(2, 51, 121, 0.8), rgba(2, 51, 121, 0.6));
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .flag-emoji {
            font-size: 20px;
            line-height: 1;
            display: inline-block;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .language-text {
            font-weight: 700;
            letter-spacing: 0.8px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .language-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            min-width: 160px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1001;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .language-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }

        .language-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #333;
            font-weight: 500;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .language-option:last-child {
            border-bottom: none;
        }

        .language-option:hover {
            background: rgba(2, 51, 121, 0.1);
            color: #023379;
            transform: translateX(4px);
        }

        .language-option .flag-emoji {
            font-size: 18px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <h1>Language Selector Test</h1>
    
    <div class="language-selector">
        <button class="language-btn" id="languageBtn" data-current="en">
            <span class="flag-emoji">🇬🇧</span>
            <span class="language-text">EN</span>
            <span>▼</span>
        </button>
        <div class="language-dropdown" id="languageDropdown">
            <div class="language-option" data-lang="en">
                <span class="flag-emoji">🇬🇧</span>
                <span>English</span>
            </div>
            <div class="language-option" data-lang="es">
                <span class="flag-emoji">🇪🇸</span>
                <span>Español</span>
            </div>
            <div class="language-option" data-lang="gl">
                <span class="flag-emoji">🏴‍☠️</span>
                <span>Galego</span>
            </div>
            <div class="language-option" data-lang="fr">
                <span class="flag-emoji">🇫🇷</span>
                <span>Français</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const languageBtn = document.getElementById("languageBtn");
            const languageDropdown = document.getElementById("languageDropdown");
            const languageOptions = document.querySelectorAll(".language-option");
            
            console.log("Language selector elements:", languageBtn, languageDropdown);
            
            if (!languageBtn || !languageDropdown) {
                console.log("Language selector elements not found");
                return;
            }
            
            // Toggle dropdown
            languageBtn.addEventListener("click", function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log("Language button clicked");
                languageDropdown.classList.toggle("active");
                languageBtn.classList.toggle("active");
            });
            
            // Close dropdown when clicking outside
            document.addEventListener("click", function(e) {
                if (!languageBtn.contains(e.target) && !languageDropdown.contains(e.target)) {
                    languageDropdown.classList.remove("active");
                    languageBtn.classList.remove("active");
                }
            });
            
            // Handle language selection
            languageOptions.forEach(option => {
                option.addEventListener("click", function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const selectedLang = this.dataset.lang;
                    console.log("Language selected:", selectedLang);
                    
                    // Update button
                    const flagEmoji = languageBtn.querySelector(".flag-emoji");
                    const languageText = languageBtn.querySelector(".language-text");
                    
                    const flagMap = {
                        "en": "🇬🇧",
                        "es": "🇪🇸", 
                        "gl": "🏴‍☠️",
                        "fr": "🇫🇷"
                    };
                    
                    if (flagMap[selectedLang]) {
                        flagEmoji.textContent = flagMap[selectedLang];
                        languageText.textContent = selectedLang.toUpperCase();
                        languageBtn.dataset.current = selectedLang;
                    }
                    
                    languageDropdown.classList.remove("active");
                    languageBtn.classList.remove("active");
                });
            });
        });
    </script>
</body>
</html>
